# DRAFT - requires independent review before any production use.
# Fail-closed by construction: the `production` environment and the
# CLOUDFLARE_API_TOKEN secret must both exist or this job cannot run.
# Deploys only website/dist/ (built from the allowlisted public/ source).
name: Public site production deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-site-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy dist to production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-26
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-10-26
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
