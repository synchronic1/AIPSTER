# Production releases deploy the exact verified merged-main SHA.
#
# Two paths share this job, serialized by the existing public-site-production
# concurrency group (cancel-in-progress false):
# - manual workflow_dispatch with an explicit reviewed_sha (owner, after review);
# - automatic workflow_run after each applicable check suite completes on main.
#
# Automatic trust boundary, enforced by the event gate before checkout and
# re-verified by release-preflight against the API immediately before deploy:
# same canonical repository (fork sources rejected), main push only, successful
# conclusion of the triggering suite, pinned head SHA checked out and confirmed
# with `git rev-parse HEAD`, current main still equal to that SHA, latest
# successful check-run for every applicable suite, a merged pull request whose
# merge commit is exactly this SHA, and no schema delta since the verified live
# baseline. Schema changes are never auto-applied or silently deployed.
#
# Applicable-check policy: the main-push site suite ("Public site asset and
# build checks") always applies. The local-worker suite ("mock-install") runs
# on main for pushes touching its path filters and applies when the cumulative
# live-to-target diff touches those paths; its result is required then. Each
# suite completion wakes this workflow; an early wake fails closed in
# preflight (the pending suite is named) and the last completion re-triggers
# the run that can proceed. PR-only checks that never run on main (installer
# build artifacts) are not deploy gates; their gate lives in PR review.
#
# Honest limitations: branch protection is absent (API returned
# "Branch not protected"), so this file cannot prove review occurred; the
# exact-merge-commit rule rejects unassociated main pushes from the automatic
# path instead. Preflight is the last recheck before `wrangler deploy`; a push
# landing between that recheck and Cloudflare propagation cannot be excluded
# by this job. The next automatic run for the newer SHA would deploy it later.
name: Public site production deploy
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full merged main commit approved for this release (in schema-diagnostic mode, the production target that main must equal)
        required: true
        type: string
      mode:
        description: deploy (main only) or schema-diagnostic (read-only production schema metadata; never deploys). No default.
        required: true
        type: choice
        options: [deploy, schema-diagnostic]
      diagnostic_sha:
        description: schema-diagnostic only - the exact independently reviewed commit of the dispatched branch
        required: false
        type: string
  workflow_run:
    workflows: ['Public site checks', 'Public local worker installation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  # The diagnostic never shares the production group, so it can neither
  # queue behind nor displace a pending production deploy.
  group: ${{ inputs.mode == 'schema-diagnostic' && 'public-site-schema-diagnostic' || 'public-site-production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy')
    name: Build and deploy dist to production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: website
    steps:
      # These two steps run before checkout, when website/ does not exist yet.
      - name: Resolve release SHA
        id: release
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      - name: Reject untrusted automatic events
        if: steps.release.outputs.mode == 'auto'
        working-directory: ${{ github.workspace }}
        run: |
          test "$TRIGGER_EVENT" = push || { echo 'Automatic deploy requires a main push event'; exit 1; }
          test "$HEAD_BRANCH" = main || { echo 'Automatic deploy requires the main branch'; exit 1; }
          test "$HEAD_REPO" = 'synchronic1/AIPSTER' || { echo 'Automatic deploy refuses fork sources'; exit 1; }
          case "$WORKFLOW_NAME" in
            'Public site checks'|'Public local worker installation') ;;
            *) echo 'Automatic deploy only follows the site or local-worker check suites'; exit 1;;
          esac
        env:
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-26
        with:
          persist-credentials: false
          fetch-depth: 0 # pin-consistency test inspects README blobs at DOCS_COMMIT (same as public-site-checks.yml)
          ref: ${{ steps.release.outputs.sha }}
      - name: Verify checkout matches the resolved release SHA
        id: verify
        working-directory: ${{ github.workspace }}
        run: |
          BUILT_SHA="$(git rev-parse HEAD)"
          echo "built_sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
          test "$BUILT_SHA" = "$RELEASE_SHA" || { echo "Checked-out $BUILT_SHA differs from resolved $RELEASE_SHA"; exit 1; }
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-10-26
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      # Pin stamps to the resolved release SHA: for workflow_run events
      # GITHUB_SHA is the branch head, not the verified head_sha.
      - name: Build dist
        run: npm run build
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
      - name: Read live deployment baseline
        id: live
        run: |
          node --input-type=module -e "import {isAlreadyLive} from './scripts/release-preflight.mjs'; const target = process.env.TARGET_SHA; let liveCommit = ''; try { const res = await fetch('https://aipster.net/deployment.json', {signal: AbortSignal.timeout(15000)}); if (res.ok) liveCommit = (await res.json()).git_commit || ''; } catch {} if (!/^[a-f0-9]{40}$/.test(liveCommit)) liveCommit = ''; const already = isAlreadyLive({liveCommit, targetSha: target}); const fs = await import('node:fs/promises'); await fs.appendFile(process.env.GITHUB_OUTPUT, 'live_sha=' + liveCommit + '\n' + 'already=' + (already ? 'true' : 'false') + '\n'); console.log(already ? 'Live revision already matches; redeploy will be skipped.' : 'Live baseline: ' + (liveCommit || '(unknown)') + '.');"
        env:
          TARGET_SHA: ${{ steps.release.outputs.sha }}
      # Baseline guard (auto only, no credentials): unknown/non-ancestor live
      # or an uncomputable delta holds before anything else runs. A migration
      # diff alone no longer holds here; production schema state is decided
      # by the credentialed `schema` step, which runs only AFTER the
      # main-revision preflight and the release gate have passed.
      - name: Hold automatic release on unknown live baseline
        id: migration
        if: steps.release.outputs.mode == 'auto'
        working-directory: ${{ github.workspace }}
        run: |
          ANCESTOR=false; DIFF_OK=false; MIGRATIONS='';
          if git cat-file -e "$LIVE_SHA^{commit}" 2>/dev/null && git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            git merge-base --is-ancestor "$LIVE_SHA" "$TARGET_SHA" 2>/dev/null && ANCESTOR=true;
            if MIGRATIONS="$(git diff --name-only "$LIVE_SHA" "$TARGET_SHA" -- website/migrations 2>/dev/null)"; then DIFF_OK=true; else MIGRATIONS=''; fi
          fi
          echo "Migration files changed since live baseline (informational): ${MIGRATIONS:-(none)}"
          export ANCESTOR DIFF_OK
          node --input-type=module -e "import {migrationHoldDecision} from './website/scripts/release-preflight.mjs'; import fs from 'node:fs/promises'; const d = migrationHoldDecision({liveSha: process.env.LIVE_SHA, targetSha: process.env.TARGET_SHA, ancestor: process.env.ANCESTOR === 'true', diffOk: process.env.DIFF_OK === 'true', changedMigrationPaths: []}); await fs.appendFile(process.env.GITHUB_OUTPUT, 'hold=' + (d.hold ? 'true' : 'false') + '\nreason=' + d.reason.replace(/\n/g, ' ') + '\n'); console.log((d.hold ? 'HOLD: ' : 'PROCEED: ') + d.reason);"
        env:
          LIVE_SHA: ${{ steps.live.outputs.live_sha }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
      - name: Determine worker-suite applicability
        id: worker
        if: steps.release.outputs.mode == 'auto' && steps.migration.outputs.hold != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          W_OK=false; CHANGED='';
          if git cat-file -e "$LIVE_SHA^{commit}" 2>/dev/null && git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            if CHANGED="$(git diff --name-only "$LIVE_SHA" "$TARGET_SHA" 2>/dev/null)"; then W_OK=true; else CHANGED=''; fi
          fi
          export W_OK CHANGED
          node --input-type=module -e "import {isWorkerApplicable} from './website/scripts/release-preflight.mjs'; import fs from 'node:fs/promises'; const ok = process.env.W_OK === 'true'; const files = ok ? (process.env.CHANGED || '').split('\n').map(s => s.trim()).filter(Boolean) : []; const applicable = !ok || isWorkerApplicable(files); await fs.appendFile(process.env.GITHUB_OUTPUT, 'applicable=' + (applicable ? 'true' : 'false') + '\n'); console.log(applicable ? 'Worker suite applies to this release.' : 'Worker suite does not apply to this release.');"
        env:
          LIVE_SHA: ${{ steps.live.outputs.live_sha }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
      - name: Require the verified current main revision and successful CI
        if: steps.migration.outputs.hold != 'true'
        run: node scripts/release-preflight.mjs
        env:
          BUILT_SHA: ${{ steps.verify.outputs.built_sha }}
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKER_APPLICABLE: ${{ steps.worker.outputs.applicable }}
          GH_TOKEN: ${{ github.token }}
      # Release gate over EVERY included PR (not just the newest merge):
      # binds each merge to its PR's exact-head review evidence, proves
      # integration via second-parent, enforces the trusted holds file and
      # merged-main CI at the target. Fails closed; a failed step stops the
      # job before deploy. Reads the holds file from this trusted release
      # checkout, never candidate-controlled content.
      - name: Enforce release gate over included PRs
        if: steps.migration.outputs.hold != 'true'
        working-directory: ${{ github.workspace }}
        run: node website/scripts/release-deploy-gate.mjs
        env:
          LIVE_SHA: ${{ steps.live.outputs.live_sha }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
      # Credentialed, read-only production schema check, both modes. Runs
      # ONLY after main-revision preflight and the release gate succeeded
      # (a failed step stops the job), so the token never reaches target
      # code before eligibility is proven. Proceeds only when every reviewed
      # migration is journaled and its added columns exist; any failed or
      # unobservable read, pending, unknown, duplicate or drifted state holds.
      # Nothing here applies or repairs a migration.
      - name: Hold release on unknown, unapplied or drifted production schema
        id: schema
        if: steps.migration.outputs.hold != 'true'
        run: |
          J="$RUNNER_TEMP/d1-journal.json"; C="$RUNNER_TEMP/d1-columns.json"
          JE=0; npx wrangler d1 execute aipster-app --remote --json --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations ORDER BY id" > "$J" || JE=$?
          PROBE="$(node scripts/migration-state.mjs probe-sql)"
          CE=0; npx wrangler d1 execute aipster-app --remote --json --config wrangler.jsonc \
            --command "$PROBE" > "$C" || CE=$?
          node scripts/migration-state.mjs decide --journal "$J" --columns "$C" \
            --journal-exit "$JE" --columns-exit "$CE" --baseline-hold false --baseline-reason none
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - run: npx wrangler deploy --config wrangler.jsonc
        if: steps.migration.outputs.hold != 'true' && steps.schema.outputs.hold == 'false' && steps.live.outputs.already != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify live assets, release revision and anonymous access protection
        if: steps.migration.outputs.hold != 'true' && steps.schema.outputs.hold == 'false'
        run: npm run verify:live
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          # On the already-live path the deployed receipt carries the deploying
          # run's own stamp, so the verifier validates the receipt instead of
          # byte-comparing deployment.json. New deploys stay byte-strict.
          AIPSTER_ALREADY_LIVE: ${{ steps.live.outputs.already }}
      - name: Report schema hold
        if: steps.migration.outputs.hold == 'true' || steps.schema.outputs.hold == 'true'
        run: |
          {
            echo "## DEPLOY HOLD ($RELEASE_MODE) — no deployment performed"
            echo ''
            echo "- release SHA: $RELEASE_SHA"
            echo "- reason: $HOLD_REASON"
            echo ''
            echo 'Production schema is not proven applied. Apply or reconcile migrations through the reviewed operator process, then re-run. This workflow never applies migrations.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::DEPLOY HOLD: $HOLD_REASON"
          exit 1
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          HOLD_REASON: ${{ steps.migration.outputs.reason || steps.schema.outputs.reason }}
  # Read-only production schema diagnostic. Never deploys, applies, writes
  # or changes flags; no environment (no deployment record); no dependency
  # path to `deploy`. A secret-free validation job must succeed first: it
  # binds the event SHA, the workflow-file SHA and (in the read job) the
  # checkout to the independently reviewed diagnostic_sha, requires that
  # SHA to differ from the deploy target, and requires production main to
  # equal reviewed_sha. Only then does the read job inject the existing
  # secret into one step running two fixed read-only queries; only a
  # sanitized verdict is printed. Limitation: GitHub runs the workflow file
  # at the dispatched branch head, so these guards bind a REVIEWED snapshot
  # but are not a sandbox against an unreviewed rewrite: freeze the branch,
  # resolve its SHA immediately before dispatch, and confirm the run's
  # head/workflow SHA afterwards (both are written to the run summary).
  schema-diagnostic-validate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'schema-diagnostic' && github.repository == 'synchronic1/AIPSTER' && github.ref == 'refs/heads/claude/migration-state-preflight' && github.triggering_actor == 'synchronic1'
    name: Validate schema diagnostic binding (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bind event, workflow file and production main to the reviewed SHAs
        run: |
          hex() { printf '%s' "$1" | grep -Eqx '[0-9a-f]{40}'; }
          hex "$DIAGNOSTIC_SHA" || { echo 'diagnostic_sha must be a full 40-hex SHA'; exit 1; }
          hex "$REVIEWED_SHA" || { echo 'reviewed_sha must be a full 40-hex SHA'; exit 1; }
          test "$DIAGNOSTIC_SHA" != "$REVIEWED_SHA" || { echo 'diagnostic_sha must differ from the deploy target'; exit 1; }
          test "$RUN_SHA" = "$DIAGNOSTIC_SHA" || { echo "Dispatched revision $RUN_SHA is not the reviewed diagnostic $DIAGNOSTIC_SHA"; exit 1; }
          test "$WORKFLOW_SHA" = "$DIAGNOSTIC_SHA" || { echo "Workflow file revision $WORKFLOW_SHA is not the reviewed diagnostic $DIAGNOSTIC_SHA"; exit 1; }
          MAIN_SHA="$(gh api repos/synchronic1/AIPSTER/commits/main --jq .sha)"
          test "$MAIN_SHA" = "$REVIEWED_SHA" || { echo "Production main $MAIN_SHA is not the reviewed target $REVIEWED_SHA"; exit 1; }
          printf '## Schema diagnostic binding\n\n- run head: %s\n- workflow file: %s\n- main: %s\n' "$RUN_SHA" "$WORKFLOW_SHA" "$MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
  schema-diagnostic:
    needs: schema-diagnostic-validate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'schema-diagnostic' && github.repository == 'synchronic1/AIPSTER' && github.ref == 'refs/heads/claude/migration-state-preflight' && github.triggering_actor == 'synchronic1'
    name: Read-only production schema diagnostic (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-26
        with:
          persist-credentials: false
          ref: ${{ inputs.diagnostic_sha }}
      - name: Verify checkout matches the reviewed diagnostic SHA
        working-directory: ${{ github.workspace }}
        run: |
          BUILT_SHA="$(git rev-parse HEAD)"
          test "$BUILT_SHA" = "$DIAGNOSTIC_SHA" || { echo "Checked-out $BUILT_SHA differs from reviewed $DIAGNOSTIC_SHA"; exit 1; }
          test "$RUN_SHA" = "$DIAGNOSTIC_SHA" && test "$WORKFLOW_SHA" = "$DIAGNOSTIC_SHA" || { echo 'run/workflow revision moved'; exit 1; }
        env:
          DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-10-26
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed read-only 0029 journal and fabric_grants column metadata
        run: |
          J="$RUNNER_TEMP/diag-journal.json"; C="$RUNNER_TEMP/diag-columns.json"
          JE=0; npx wrangler d1 execute aipster-app --remote --json --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations WHERE name = '0029_fabric_dispatch_spend.sql'" > "$J" 2> "$J.err" || JE=$?
          CE=0; npx wrangler d1 execute aipster-app --remote --json --config wrangler.jsonc \
            --command "SELECT 'fabric_grants' AS t, name, type, \"notnull\" AS nn, dflt_value AS dflt FROM pragma_table_info('fabric_grants')" > "$C" 2> "$C.err" || CE=$?
          node scripts/migration-state.mjs diagnose --journal "$J" --columns "$C" \
            --journal-exit "$JE" --columns-exit "$CE" --journal-stderr "$J.err" --columns-stderr "$C.err"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
