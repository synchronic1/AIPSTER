# The release owner dispatches only after independent review and merge.
# This explicit revision gate complements protected main/environment approvals;
# it does not replace those repository settings or prove a review occurred.
name: Public site production deploy
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full merged main commit approved for this release
        required: true
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: public-site-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and deploy dist to production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-26
        with:
          persist-credentials: false
          fetch-depth: 0 # pin-consistency test inspects README blobs at DOCS_COMMIT (same as public-site-checks.yml)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-10-26
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Require the reviewed current main revision and successful CI
        run: node scripts/release-preflight.mjs
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GH_TOKEN: ${{ github.token }}
      - run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify live assets, release revision and anonymous access protection
        run: npm run verify:live
